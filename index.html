<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartas · Menos es más</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<style>
:root{--bg:#f4efe6;--ink:#2b2118;--pan:#fffaf0;--line:#d8cbb4;--ac:#b5382a;--felt:#1f6b4a;--felt2:#17503a;--cw:clamp(42px,11.5vw,76px);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1713;--ink:#f3eadb;--pan:#2a231c;--line:#463b2f;--ac:#e0604f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1b1713;--ink:#f3eadb;--pan:#2a231c;--line:#463b2f;--ac:#e0604f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Fredoka,system-ui,sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
h1,h2{margin:0 0 8px}button,input{font:inherit}
.btn{border:0;border-radius:14px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;min-height:44px}.btn.g{background:var(--pan);color:var(--ink);border:2px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
input{background:var(--pan);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
.pan{background:var(--pan);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:140px}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.table{background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border-radius:26px;padding:12px;color:#fff;border:6px solid #5b3a1f;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.rivs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rv{background:rgba(0,0,0,.2);border-radius:14px;padding:8px;border:2px solid transparent}.rv.on,.me.on{border-color:#ffd54a}
.rv b{display:block}.rv small{opacity:.85}
.hand{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.c{width:var(--cw);height:calc(var(--cw)*1.45);border-radius:9px;flex:none;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.4);user-select:none}
.rv .c{--cw:clamp(26px,6.5vw,44px)}
.c.b{background:repeating-linear-gradient(45deg,#8e2a22 0 6px,#a8362c 6px 12px);border:3px solid #f3eadb}
.c.f{background:#fffaf0;color:var(--s);border:3px solid var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600}
.c.f b{font-size:calc(var(--cw)*.5);line-height:1}.c.f i{font-style:normal;font-size:calc(var(--cw)*.2)}
.c.k{cursor:pointer;outline:3px solid #ffd54a;animation:pu 1s infinite}@keyframes pu{50%{transform:translateY(-5px)}}
.mid{display:flex;justify-content:center;gap:18px;align-items:center;margin:14px 0;flex-wrap:wrap}.mid small{display:block;text-align:center}
.me{background:rgba(0,0,0,.2);border-radius:14px;padding:8px;border:2px solid transparent}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.msg{text-align:center;min-height:1.4em;font-weight:600}.logs{font-size:.8rem;opacity:.85;text-align:center}
.chip{display:inline-block;background:#ffd54a;color:#2b2118;border-radius:99px;padding:0 8px;font-size:.75rem}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line)}
#chat{position:fixed;left:0;right:0;bottom:0;background:var(--pan);border-top:2px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
#chat summary{cursor:pointer;font-weight:600}#cl{max-height:28vh;overflow:auto;font-size:.9rem;padding:6px 0}#cl i{opacity:.6;font-style:normal;font-size:.75rem}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ac);color:#fff;padding:9px 18px;border-radius:99px;z-index:50;font-weight:600;max-width:92vw;text-align:center}
</style></head>
<body><main id="m"></main>
<details id="chat" hidden><summary id="cs">Chat</summary><div id="cl"></div><div class="row"><input id="ci" maxlength="300" placeholder="Escribe un mensaje…" autocomplete="off"><button class="btn" id="cb">Enviar</button></div></details>
<script>
/* ================= CLIENTE ================= */
const num=c=>(c>>2)+1,sui=c=>c&3,val=c=>{const n=num(c);return n==2?-1:n==10?0:n};
const SU=['Oros','Copas','Espadas','Bastos'],SC=['#c99100','#c0392b','#2c5aa0','#2e7d32'];
const nm=(S,id)=>(S.players.find(p=>p.id==id)||{}).name||'?';

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let me='',tk='',code='',S=null,T=null,QM=false,OFF=0,CH=[],es=null,LOCAL=false,err='',lastEv;
const sn=()=>Date.now()+OFF,isMe=()=>S&&S.players.some(p=>p.id==me);
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)};
const card=(c,face,k,at='')=>face?`<div class="c f${k?' k':''}" style="--s:${SC[sui(c)]}" ${at}><b>${num(c)}</b><i>${SU[sui(c)]}</i></div>`:`<div class="c b${k?' k':''}" ${at}></div>`;
async function api(p,b){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error del servidor');return j}
async function post(type,args){try{const j=await api('act',{code,pid:me,token:tk,type,args:args||{}});if(j.msg)toast(j.msg);return j}catch(e){toast(e.message);return null}}
const A=post,nameOf=()=>($('#nm')&&$('#nm').value.trim())||ls.get('c-name')||'';
function connect(){if(es)es.close();es=new EventSource('/api/events?code='+code+'&pid='+me+'&token='+tk);
 es.onmessage=e=>{S=JSON.parse(e.data);OFF=S.now-Date.now();const first=lastEv===undefined;if(S.ev&&!first&&S.ev.n!==lastEv)toast(S.ev.t);lastEv=S.ev?S.ev.n:null;CH=S.chat||[];drawChat();render()}}
function start(j){code=j.code;me=j.pid;tk=j.token;ls.set('c-s-'+code,JSON.stringify(j));location.hash=code;lastEv=undefined;connect()}
async function make(){const n=nameOf();if(!n)return toast('Escribe un nombre');ls.set('c-name',n);try{start(await api('create',{name:n}))}catch(e){toast(e.message)}}
async function join(c){const n=nameOf();if(!n)return toast('Escribe un nombre');ls.set('c-name',n);c=(c||'').trim().toUpperCase();if(!/^[A-Z0-9]{3,8}$/.test(c))return toast('Código no válido');
 let old={};try{old=JSON.parse(ls.get('c-s-'+c)||'{}')}catch(e){}try{err='';start(await api('join',{code:c,name:n,pid:old.pid,token:old.token}))}catch(e){err='<p>'+e.message+'</p>';render()}}
function canQ(){const q=S&&S.qd;return S&&S.phase=='play'&&isMe()&&q&&!q.done&&sn()<q.until&&q.ex!=me&&!(S.turn==me&&S.sub=='drawn')&&!q.tried.includes(me)}
function ca(pid,i){const own=pid==me;if(S.phase=='peek')return own&&!S.ready[me]&&(S.peeks[me]||0)<S.allow[me]?'peek':'';if(S.phase!='play')return'';if(own&&QM&&canQ())return'quick';if(S.turn!=me)return'';if(own&&S.sub=='drawn')return'replace';if(own&&S.sub=='a11')return'look11';if(!own&&S.sub=='a12a')return'pick12';if(own&&S.sub=='a12b')return'swap12';return''}
function hand(pid){const h=S.hands[pid]||[],rev=S.phase=='reveal'||S.phase=='over',x=S.p12;return`<div class="hand">${h.map((c,i)=>{let v=null;if(rev)v=c;else if(T&&T.p==pid&&T.i==i&&T.u>Date.now())v=T.c;else if(S.phase=='play'&&S.turn==me&&S.sub=='a12b'&&x&&x.rp==pid&&x.ri==i)v=x.c;const a=ca(pid,i);return card(v,v!=null,a,a?`data-a="${a}" data-p="${pid}" data-i="${i}"`:'')}).join('')}</div>`}
const tot=pid=>(S.rounds||[]).reduce((a,r)=>a+(r.sc[pid]||0),0);
function render(){const m=$('#m');$('#chat').hidden=!S||!isMe();
 
 if(!S||!isMe()){return m.innerHTML=`<div class="pan"><h1>Cartas · menos es más</h1><p>Juego de cartas español para 2 a 4 jugadores.</p><label>Tu nombre</label><input id="nm" maxlength="20" value="${esc(ls.get('c-name')||'')}"><div class="row" style="margin-top:10px"><button class="btn" data-a="make">Crear sala</button></div><h2 style="margin-top:18px">Entrar con código</h2><div class="row"><input id="jc" maxlength="8" placeholder="Código" value="${esc(code)}"><button class="btn" data-a="join">Entrar</button></div>${err}</div>`}
 const link=location.href.split('#')[0]+'#'+code,pl=S.players;
 if(S.phase=='lobby')return m.innerHTML=`<div class="pan"><h1>Sala ${esc(code)} <span class="chip">${pl.length}/4</span></h1><p>Comparte el enlace o el código:</p><div class="row"><input readonly value="${esc(link)}" id="lk"><button class="btn g" data-a="copy">Copiar enlace</button></div><h2 style="margin-top:14px">Jugadores</h2>${pl.map(p=>`<div class="pl"><span>${esc(p.name)}${p.id==S.host?' <span class="chip">anfitrión</span>':''}${p.id==me?' (tú)':''}</span></div>`).join('')}${S.host==me?`<div class="row" style="margin-top:12px"><button class="btn" data-a="start"${pl.length<2?' disabled':''}>Iniciar partida</button></div>`:'<p>Esperando a que el anfitrión inicie…</p>'}${LOCAL?'<p>Modo local: sin acceso a la base compartida, la partida solo se sincroniza entre pestañas de este navegador.</p>':''}<p style="font-size:.8rem;opacity:.7">Nota: los datos de la partida se comparten con todos los participantes; las cartas ocultas lo están en pantalla, no a nivel técnico.</p></div>`;
 if(S.phase=='over'){const rk=[...pl].sort((a,b)=>tot(a.id)-tot(b.id));return m.innerHTML=`<div class="pan"><h1>Resultados finales</h1><h2>🏆 Gana ${esc(rk[0].name)}</h2><table><tr><th>#</th><th>Jugador</th>${S.rounds.map(r=>`<th>R${r.r}</th>`).join('')}<th>Total</th></tr>${rk.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td>${S.rounds.map(r=>`<td>${r.sc[p.id]}</td>`).join('')}<td><b>${tot(p.id)}</b></td></tr>`).join('')}</table>${S.host==me?`<div class="row" style="margin-top:12px"><button class="btn" data-a="newgame">Nueva partida</button><button class="btn g" data-a="lobby">Volver al lobby</button></div>`:'<p>El anfitrión puede iniciar otra partida.</p>'}</div>`}
 const oth=pl.filter(p=>p.id!=me),st=p=>S.planted[p.id]?'plantado':'jugando',rv=S.phase=='reveal',tn=S.turn?nm(S,S.turn):'';
 let ctr='',acts='',info='';const q=S.qd;
 if(S.phase=='peek'){const left=S.allow[me]-(S.peeks[me]||0);info=S.ready[me]?'Esperando a los demás…':`Ronda ${S.round}: puedes mirar ${S.allow[me]} de tus ${S.hands[me].length} cartas (te quedan ${left}). Toca las que quieras ver.`;acts=S.ready[me]?'':'<button class="btn" data-a="ready">Listo, empezar</button>'}
 else if(S.phase=='play'){const mine=S.turn==me;info=mine?({draw:'Tu turno: roba una carta',drawn:'Elige una carta tuya para sustituir, o descarta la robada',a11:'11: toca una carta tuya para mirarla',a12a:'12: toca una carta de un rival',a12b:'12: toca una carta tuya para intercambiarla'})[S.sub]||'':(S.turn?'Turno de '+esc(tn):'Esperando decisiones…');
  if(mine&&S.sub=='draw')acts+='<button class="btn" data-a="draw">ROBAR CARTA</button>';
  if(mine&&S.sub=='drawn'){acts+='<button class="btn g" data-a="discard">Descartar</button>';if(num(S.held)==11)acts+='<button class="btn" data-a="use11">Usar el 11 (mirar una propia)</button>';if(num(S.held)==12)acts+='<button class="btn" data-a="use12">Usar el 12 (intercambiar con un rival)</button>'}
  if(S.dec==me)acts+='<button class="btn" data-a="keep">SEGUIR PLANTADO</button><button class="btn g" data-a="unplant">DESPLANTARME</button>';
  else if(S.planted[me])acts+='<button class="btn g" data-a="unplant">DESPLANTARME</button>';else if(!(mine&&S.sub!='draw'))acts+='<button class="btn g" data-a="plant">PLANTARSE</button>';
  if(canQ())acts+=`<button class="btn" data-a="qm" style="background:#ffd54a;color:#2b2118">${QM?'Toca la carta…':'¡DESCARTE RÁPIDO '+q.n+'!'}</button>`}
 else if(rv){info='Ronda terminada'+(S.final?'':' · '+nm(S,S.winner)+' empezará la siguiente con una carta más');acts=S.host==me?`<button class="btn" data-a="nextround">${S.final?'Ver resultados finales':'Siguiente ronda'}</button>`:'<p>Espera al anfitrión…</p>'}
 const top=S.discTop!=null?card(S.discTop,true,''):'<div class="c" style="border:2px dashed #fff8;box-shadow:none"></div>';
 const held=S.phase=='play'&&S.turn==me&&S.held!=null?`<div><small>Tu carta robada</small>${card(S.held,true,'')}</div>`:'';
 m.innerHTML=`<div class="table"><div class="row" style="justify-content:space-between"><b>Sala ${esc(code)} · Ronda ${S.round}${S.final?' (última)':''}</b><span class="chip">${S.deckN} en el mazo</span></div><div class="rivs" style="margin-top:8px">${oth.map(p=>`<div class="rv${S.turn==p.id?' on':''}"><b>${esc(p.name)}</b><small>${S.hands[p.id].length} cartas · ${st(p)}${S.dec==p.id?' · decidiendo':''}${rv?' · '+S.hands[p.id].reduce((a,c)=>a+val(c),0)+' pts':''}</small>${hand(p.id)}</div>`).join('')}</div>
 <div class="mid"><div><small>Montón de robo</small>${S.deckN?`<div class="c b${S.turn==me&&S.sub=='draw'&&S.phase=='play'?' k':''}"${S.turn==me&&S.sub=='draw'?' data-a="draw"':''}></div>`:'<div class="c"></div>'}</div>${held}<div><small>Descarte</small>${top}</div></div>
 <div class="msg">${info}</div><div class="logs">${(S.log||[]).slice(-3).map(esc).join(' · ')}</div>
 <div class="me${S.turn==me?' on':''}"><b>${esc(nm(S,me))}</b> <small>${st({id:me})}${rv?' · '+S.hands[me].reduce((a,c)=>a+val(c),0)+' pts':''}</small>${hand(me)}</div><div class="acts">${acts}</div></div>
 ${rv?`<div class="pan" style="margin-top:12px"><h2>Ronda ${S.round}: gana ${esc(nm(S,S.winner))}</h2><table>${[...pl].sort((a,b)=>S.rounds[S.rounds.length-1].sc[a.id]-S.rounds[S.rounds.length-1].sc[b.id]).map(p=>`<tr><td>${esc(p.name)}</td><td>${S.rounds[S.rounds.length-1].sc[p.id]} pts</td><td>total ${tot(p.id)}</td></tr>`).join('')}</table></div>`:''}`;
 if(q&&!q.done&&sn()<q.until)setTimeout(()=>{QM=false;if(S&&S.qd===q||true)render()},Math.max(50,q.until-sn()+60))}
function drawChat(){const l=$('#cl');if(!l)return;l.innerHTML=CH.map(x=>`<div><b>${esc(x.n)}</b> <i>${new Date(x.t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</i> ${esc(x.x)}</div>`).join('');l.scrollTop=l.scrollHeight;$('#cs').textContent='Chat'+(CH.length?' ('+CH.length+')':'')}
async function send(){const i=$('#ci'),x=i.value.trim();if(!x||!isMe())return;i.value='';try{await api('chat',{code,pid:me,token:tk,text:x})}catch(e){toast(e.message)}}
$('#cb').onclick=send;$('#ci').onkeydown=e=>{if(e.key=='Enter')send()};
const tmo=ms=>setTimeout(()=>{T=null;render()},ms+50);
const H={make,join:()=>join($('#jc').value),copy:async()=>{const l=location.href.split('#')[0]+'#'+code;try{await navigator.clipboard.writeText(l);toast('Enlace copiado')}catch(e){$('#lk').select();toast('Selecciona y copia el enlace')}},
start:()=>A('start'),ready:()=>A('ready'),draw:()=>A('draw'),discard:()=>A('discard'),use11:()=>A('use11'),use12:()=>A('use12'),keep:()=>A('keep'),plant:()=>A('plant'),unplant:()=>A('unplant'),nextround:()=>A('nextround'),newgame:()=>A('newgame'),lobby:()=>A('lobby'),
qm:()=>{QM=!QM;render()},
peek:async d=>{const j=await A('peek',{i:+d.i});if(j&&j.card!=null){T={p:me,i:+d.i,c:j.card,u:Date.now()+2500};render();tmo(2500)}},
look11:async d=>{const j=await A('look11',{i:+d.i});if(j&&j.card!=null){T={p:me,i:+d.i,c:j.card,u:Date.now()+3000};render();tmo(3000)}},
replace:d=>A('replace',{i:+d.i}),swap12:d=>A('swap12',{i:+d.i}),pick12:d=>A('pick12',{rp:d.p,ri:+d.i}),
quick:async d=>{QM=false;render();await A('quick',{i:+d.i})}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&H[t.dataset.a])H[t.dataset.a](t.dataset)});
(()=>{const c=location.hash.slice(1).toUpperCase();if(c){code=c;try{const o=JSON.parse(ls.get('c-s-'+c)||'null');if(o&&o.pid){me=o.pid;tk=o.token;connect()}}catch(e){}}render()})();
window.addEventListener('hashchange',()=>{const c=location.hash.slice(1).toUpperCase();if(c&&c!=code){code=c;S=null;if(es)es.close();render()}});
</script></body></html>
